name: Test Sagemaker Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/test_sagemaker.yml"
      - "optimum/neuron/utils/ecr.py"
      - "tests/sagemaker/**"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/test_sagemaker.yml"
      - "optimum/neuron/utils/ecr.py"
      - "tests/sagemaker/**"

jobs:
  do-the-job:
    name: Run Sagemaker Related Tests
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Neuronx runtime
        uses: ./.github/actions/install_neuronx_runtime
      - name: Setup virtual environment
        uses: ./.github/actions/setup_venv
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_SANDBOX_GITHUB_CI_PUSH_ECR}}
          aws-region: us-east-1

      - name: Test Sagemaker related tests
        run: |
          source aws_neuron_venv_pytorch/bin/activate
          pytest -sv tests/sagemaker/test_images_uri.py
