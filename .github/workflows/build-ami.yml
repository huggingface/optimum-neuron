# The workflow file for building the AWS Neuron AMI using Packer
# It can be triggered by push and pull request to main when changes made to infrastructure/ami folder, manually and scheduler.
name: Build AWS Neuron AMI
on:
    push:
      branches:
        - main
      paths:
        - 'infrastructure/ami/**'
    pull_request:
      branches:
        - main
      paths:
        - 'infrastructure/ami/**'
    workflow_dispatch:
      inputs:
        tag:
          description: 'Tag to use for the AMI build'
          default: 'main'
    schedule:
      # Schedule the workflow to run every second day at midnight UTC
      - cron: '0 0 */2 * *'

jobs:
    build-ami:
        defaults:
          run:
            working-directory: infrastructure/ami
        runs-on: ubuntu-latest
        permissions:
          contents: read
          id-token: write # Required to mint the OIDC token the AWS role is assumed with.
        env:
          AWS_REGION: us-east-1
        steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

          - name: Setup Packer
            uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789  # main
            id: setup-packer
            with:
              version: "1.10.1"

          - name: configure aws credentials
            uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
            with:
              role-to-assume: arn:aws:iam::907797767998:role/optimum-neuron-build-ami
              aws-region: ${{ env.AWS_REGION }}

          - name: Packer format
            id: format
            run: packer fmt hcl2-files
            continue-on-error: true

          - name: Packer Init
            id: init
            run: packer init hcl2-files
            continue-on-error: true


          - name: Packer Validate
            id: validate
            # If the workflow is triggered manually or scheduled, uses the tag, otherwise uses the name of branch that triggered workflow for building the AMI
            env:
              OPTIMUM_VERSION: ${{ github.event.inputs.tag || github.head_ref || github.ref_name }}
            run: packer validate -var "optimum_version=$OPTIMUM_VERSION" -var "region=${{ env.AWS_REGION }}" hcl2-files
            continue-on-error: true

          - name: Packer Build
            id: build
            # If the workflow is triggered manually or scheduled, uses the tag, otherwise uses the name of branch that triggered workflow for building the AMI
            env:
              OPTIMUM_VERSION: ${{ github.event.inputs.tag || github.head_ref || github.ref_name }}
            run:  |
              packer build -var "optimum_version=$OPTIMUM_VERSION" -var "region=${{ env.AWS_REGION }}" hcl2-files

          - name: Slack Notification on Failure
            id: slack
            uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
            if: ${{ failure() && github.event_name == 'schedule' }}
            with:
              channel-id: 'C06GAEQJLNN' #copied from slack channel
              payload: |
                {
                  "text": "GitHub Action HuggingFace Neuron AMI Build result: ${{job.status}}"
                }
            env:
              SLACK_BOT_TOKEN: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
